version: 1.0.3
description: Local UPF plus mock SMF experiment
pfcp:
  addr: 127.0.0.8
  nodeID: 127.0.0.8
  retransTimeout: 1s
  maxRetrans: 3
gtpu:
  forwarder: gtp5g
  xdpCpuPolicy:
    reservedPrefixCount: 16
  ifList:
    - addr: 10.200.0.1
      type: N3
dnnList:
  - dnn: internet
    cidr: 10.60.0.0/16
logger:
  enable: true
  level: info
  reportCaller: false
